<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hostel HMS · Add New Resident</title>
    <style>
        /* ============================================
           GLOBAL RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #d5dce8 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================
           FORM CONTAINER
           ============================================ */
        .form-container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 44px 48px 48px;
            box-shadow: 0 30px 80px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.5);
            transition: 0.3s;
            position: relative;
        }

        .form-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 40px 100px rgba(0, 20, 40, 0.3);
        }

        .back-link {
            position: absolute;
            top: 24px;
            right: 28px;
            text-decoration: none;
            color: #1a5c8a;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid #d8e2ec;
            border-radius: 20px;
            transition: 0.2s;
        }

        .back-link:hover {
            background: #e8f0fe;
        }

        /* ============================================
           HEADER
           ============================================ */
        .form-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .form-header .header-icon {
            font-size: 36px;
        }

        .form-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0b1a2b;
            letter-spacing: -0.3px;
        }

        .form-header h1 span {
            color: #2d7bb6;
        }

        .form-subtitle {
            font-size: 15px;
            color: #6d8aa8;
            margin-bottom: 32px;
            padding-left: 52px;
            font-weight: 400;
        }

        /* ============================================
           FORM ELEMENTS
           ============================================ */
        .resident-form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 13px;
            color: #1a3450;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-group label .required {
            color: #e74c3c;
            font-weight: 700;
            font-size: 16px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 13px 18px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.25s;
            font-family: inherit;
            color: #0b1a2b;
            width: 100%;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2d7bb6;
            background: white;
            box-shadow: 0 0 0 4px rgba(45, 123, 182, 0.08);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #a0b8cc;
        }

        /* ============================================
           FILE UPLOAD (ID / Photo)
           ============================================ */
        .upload-area {
            border: 2px dashed #d8e2ec;
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            background: #fafcfe;
            transition: 0.25s;
            position: relative;
        }

        .upload-area:hover {
            border-color: #2d7bb6;
            background: #f0f7fe;
        }

        .upload-area .upload-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 6px;
        }

        .upload-area .upload-title {
            font-weight: 600;
            font-size: 15px;
            color: #0b1a2b;
        }

        .upload-area .upload-subtitle {
            font-size: 13px;
            color: #6d8aa8;
            margin-top: 2px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 12px;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-input-wrapper .file-label {
            display: inline-block;
            padding: 9px 24px;
            background: linear-gradient(135deg, #1a5c8a, #2d7bb6);
            color: white;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 12px rgba(26, 92, 138, 0.2);
        }

        /* ============================================
           SUBMIT BUTTON
           ============================================ */
        .btn-submit {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #1a5c8a, #2d7bb6);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(26, 92, 138, 0.3);
            letter-spacing: 0.3px;
            font-family: inherit;
            transition: 0.25s;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(26, 92, 138, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Footer Note */
        .form-footer-note {
            margin-top: 18px;
            font-size: 13px;
            color: #6d8aa8;
            text-align: center;
            background: rgba(0, 0, 0, 0.02);
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 768px) {
            .form-container {
                padding: 28px 24px 32px;
                border-radius: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .form-header h1 {
                font-size: 24px;
            }

            .form-subtitle {
                padding-left: 0;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <script>
        /**
 * Add New Resident Page Script
 */
document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('.resident-form');
    if (!form) return;

    // File upload label updater
    const fileInput = document.querySelector('input[type="file"]');
    const fileLabel = document.querySelector('.file-label');
    if (fileInput && fileLabel) {
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileLabel.textContent = `📁 ${e.target.files[0].name}`;
                fileLabel.style.background = '#1b7a3e';
            }
        });
    }

    // Form submission handler with LocalStorage persistence
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const residentData = {
            fullName: document.getElementById('fullName').value.trim(),
            studentId: document.getElementById('studentId').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            hostelBlock: document.getElementById('hostelBlock').value,
            roomNumber: document.getElementById('roomNumber').value.trim(),
            guardianName: document.getElementById('guardianName').value.trim(),
            emergencyPhone: document.getElementById('emergencyPhone').value.trim(),
            joinedDate: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        };

        if (!residentData.fullName || !residentData.studentId || !residentData.email || !residentData.phone || !residentData.hostelBlock || !residentData.roomNumber) {
            alert('Please fill in all mandatory fields marked with *.');
            return;
        }

        // Save to LocalStorage
        let residents = JSON.parse(localStorage.getItem('hms_new_residents')) || [];
        residents.push(residentData);
        localStorage.setItem('hms_new_residents', JSON.stringify(residents));

        showToast(`Successfully registered ${residentData.fullName}!`);
        setTimeout(() => {
            window.location.href = 'submit.html';
        }, 1200);
    });
});

function showToast(msg) {
    let t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#1a5c8a;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.2);';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}
    </script>

    <!-- ============================================
    ADD RESIDENT FORM CONTAINER
    ============================================ -->
    <div class="form-container">
        <a href="resident.html" class="back-link">← Back to Directory</a>

        <!-- Header -->
        <div class="form-header">
            <span class="header-icon">👤</span>
            <h1>Add New <span>Resident</span></h1>
        </div>
        <p class="form-subtitle">Register a new resident and assign them a hostel room</p>

        <!-- Form -->
        <form class="resident-form" action="submit.html" method="GET">

            <!-- Row 1: Full Name + Roll/ID Number -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">
                        Full Name <span class="required">*</span>
                    </label>
                    <input type="text" id="fullName" placeholder="e.g. Ananya Sharma" required />
                </div>
                <div class="form-group">
                    <label for="studentId">
                        Student ID / Registration No. <span class="required">*</span>
                    </label>
                    <input type="text" id="studentId" placeholder="e.g. 2026-CS-104" required />
                </div>
            </div>

            <!-- Row 2: Email + Phone Number -->
            <div class="form-row">
                <div class="form-group">
                    <label for="email">
                        Email Address <span class="required">*</span>
                    </label>
                    <input type="email" id="email" placeholder="student@example.com" required />
                </div>
                <div class="form-group">
                    <label for="phone">
                        Phone Number <span class="required">*</span>
                    </label>
                    <input type="tel" id="phone" placeholder="+91 98765 43210" required />
                </div>
            </div>

            <!-- Row 3: Hostel Block + Room Assignment -->
            <div class="form-row">
                <div class="form-group">
                    <label for="hostelBlock">
                        Hostel Block <span class="required">*</span>
                    </label>
                    <select id="hostelBlock" required>
                        <option value="">Select Hostel Block</option>
                        <option value="block-a">Block A (Boys)</option>
                        <option value="block-b">Block B (Girls)</option>
                        <option value="block-c">Block C (Senior)</option>
                        <option value="block-d">Block D (PG)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="roomNumber">
                        Room Number <span class="required">*</span>
                    </label>
                    <input type="text" id="roomNumber" placeholder="e.g. C-204" required />
                </div>
            </div>

            <!-- Row 4: Emergency Contact Name + Emergency Phone -->
            <div class="form-row">
                <div class="form-group">
                    <label for="guardianName">
                        Guardian / Emergency Contact Name <span class="required">*</span>
                    </label>
                    <input type="text" id="guardianName" placeholder="e.g. Ramesh Sharma" required />
                </div>
                <div class="form-group">
                    <label for="emergencyPhone">
                        Emergency Phone Number <span class="required">*</span>
                    </label>
                    <input type="tel" id="emergencyPhone" placeholder="+91 98123 45678" required />
                </div>
            </div>

            <!-- Photo / ID Document Upload -->
            <div class="form-group">
                <label>Upload Student ID or Photo</label>
                <div class="upload-area">
                    <span class="upload-icon">📷</span>
                    <div class="upload-title">Upload Profile Photo or ID Proof</div>
                    <div class="upload-subtitle">PNG, JPG, or PDF up to 5MB</div>
                    <div class="file-input-wrapper">
                        <span class="file-label">📁 Choose File</span>
                        <input type="file" accept="image/*,.pdf" />
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">
                ➕ Register Resident
            </button>

            <!-- Footer Note -->
            <div class="form-footer-note">
                ⚡ Fields marked with <span>*</span> are mandatory for room allocation.
            </div>

        </form>
    </div>

</body>
</html>
