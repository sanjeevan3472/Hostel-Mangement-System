<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Meta tag to redirect to index.html after 1.5 seconds -->
    <meta http-equiv="refresh" content="1.5;url=index.html" />

    <title>Hostel HMS · Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a1628;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .loader-icon {
            font-size: 48px;
            margin-bottom: 16px;
            animation: pulse 1.2s infinite ease-in-out;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            color: #5ba3d9;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #8aaac4;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="loader-icon">🏠</div>
    <h2>Loading Hostel HMS...</h2>
    <p>Please wait while we prepare your dashboard.</p>

</body>
</html>
