<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Redirects to index.html after 2 seconds -->
    <meta http-equiv="refresh" content="2;url=index.html" />
    <title>Hostel HMS · Submission Received</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #d5dce8 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 36px;
            box-shadow: 0 30px 80px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .success-icon {
            font-size: 54px;
            margin-bottom: 16px;
            display: inline-block;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b1a2b;
            margin-bottom: 8px;
        }

        h1 span {
            color: #2d7bb6;
        }

        p {
            font-size: 14px;
            color: #6d8aa8;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #1a5c8a, #2d7bb6);
            border-radius: 10px;
            animation: fillProgress 2s linear forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .redirect-note {
            font-size: 12px;
            color: #8aaac4;
        }

        .manual-link {
            color: #1a5c8a;
            font-weight: 600;
            text-decoration: none;
        }

        .manual-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script>
        /**
 * Submission Success Page Script
 */
document.addEventListener('DOMContentLoaded', () => {
    console.log('[HMS]: Submission processed successfully. Initializing redirect timer...');
    
    setTimeout(() => {
        window.location.href = 'index.html';
    }, 2000);
});
    </script>

    <div class="success-card">
        <div class="success-icon">✅</div>
        <h1>Submission <span>Successful!</span></h1>
        <p>Your request has been recorded in the system. Redirecting you back to the main dashboard...</p>
        
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>

        <div class="redirect-note">
            If you are not redirected automatically, <a href="index.html" class="manual-link">click here</a>.
        </div>
    </div>

    <script>
        setTimeout(function () {
            window.location.href = "index.html";
        }, 2000);
    </script>
</body>
</html>
